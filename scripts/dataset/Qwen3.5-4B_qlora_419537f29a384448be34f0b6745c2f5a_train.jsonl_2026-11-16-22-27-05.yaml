training:
  max_seq_length: 4096
  num_epochs: 5
  learning_rate: 0.0002
  embedding_learning_rate: null
  batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 5
  max_steps: 0
  save_steps: 30
  eval_steps: 0.1
  early_stopping_patience: 0
  weight_decay: 0.001
  random_seed: 3407
  packing: true
  train_on_completions: true
  gradient_checkpointing: unsloth
  offload_layers: 0
  offload_vram_gb: null
  offload_vram_gb_per_device: {}
  prefetch_depth: 2
  optim: adamw_8bit
  lr_scheduler_type: linear
lora:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - all-linear
  use_rslora: false
  use_loftq: false
  use_dora: false
logging:
  enable_wandb: false
  wandb_project: llm-finetuning
  enable_tensorboard: false
  tensorboard_dir: runs
  log_frequency: 10
